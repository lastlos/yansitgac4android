<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="640" viewBox="0 0 1080 640" font-family="DejaVu Sans, Noto Sans, sans-serif">
  <!-- Yansıtgaç README: "Geliştirici seçenekleri ve USB hata ayıklama nasıl açılır" (marka bağımsız çizim) -->
  <rect width="1080" height="640" fill="#ffffff"/>

  <defs>
    <g id="telefon">
      <rect x="0" y="0" width="300" height="540" rx="34" fill="#1f2933"/>
      <rect x="12" y="44" width="276" height="452" rx="6" fill="#f5f7fa"/>
      <rect x="120" y="18" width="60" height="8" rx="4" fill="#3e4c59"/>
      <circle cx="150" cy="518" r="11" fill="none" stroke="#52606d" stroke-width="3"/>
    </g>
  </defs>

  <!-- ===== 1. Ayarlar ===== -->
  <g transform="translate(30,70)">
    <text x="150" y="-30" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2933">1. Ayarlar</text>
    <use xlink:href="#telefon"/>
    <text x="30" y="88" font-size="22" font-weight="bold" fill="#1f2933">Ayarlar</text>
    <g font-size="17" fill="#323f4b">
      <text x="30" y="140">Ağ ve internet</text>
      <line x1="24" y1="158" x2="276" y2="158" stroke="#e4e7eb"/>
      <text x="30" y="192">Bağlı cihazlar</text>
      <line x1="24" y1="210" x2="276" y2="210" stroke="#e4e7eb"/>
      <text x="30" y="244">Ekran</text>
      <line x1="24" y1="262" x2="276" y2="262" stroke="#e4e7eb"/>
      <text x="30" y="296">Pil</text>
      <line x1="24" y1="314" x2="276" y2="314" stroke="#e4e7eb"/>
    </g>
    <rect x="18" y="330" width="264" height="54" rx="10" fill="#dbeafe" stroke="#2b6cb0" stroke-width="3"/>
    <text x="32" y="364" font-size="18" font-weight="bold" fill="#1e4e8c">Telefon hakkında</text>
    <text x="150" y="440" text-anchor="middle" font-size="14" fill="#616e7c">En alttaki bu bölüme girin</text>
  </g>

  <!-- ok -->
  <path d="M345 340 h26 v-14 l24 24 l-24 24 v-14 h-26 z" fill="#2b6cb0"/>

  <!-- ===== 2. Telefon hakkında ===== -->
  <g transform="translate(390,70)">
    <text x="150" y="-30" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2933">2. Yedi kez dokunun</text>
    <use xlink:href="#telefon"/>
    <text x="30" y="88" font-size="20" font-weight="bold" fill="#1f2933">Telefon hakkında</text>
    <g font-size="15" fill="#323f4b">
      <text x="30" y="136">Model</text>
      <text x="30" y="156" fill="#7b8794" font-size="13">ABC-123</text>
      <line x1="24" y1="172" x2="276" y2="172" stroke="#e4e7eb"/>
      <text x="30" y="200">Android sürümü</text>
      <text x="30" y="220" fill="#7b8794" font-size="13">13</text>
      <line x1="24" y1="236" x2="276" y2="236" stroke="#e4e7eb"/>
    </g>
    <rect x="18" y="248" width="264" height="62" rx="10" fill="#dbeafe" stroke="#2b6cb0" stroke-width="3"/>
    <text x="32" y="275" font-size="17" font-weight="bold" fill="#1e4e8c">Yapım numarası</text>
    <text x="32" y="296" font-size="13" fill="#3e4c59">TP1A.220624.014</text>
    <!-- dokunma işareti -->
    <circle cx="246" cy="279" r="22" fill="#2b6cb0"/>
    <text x="246" y="286" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">7×</text>
    <!-- bildirim balonu -->
    <rect x="34" y="400" width="232" height="44" rx="22" fill="#323f4b"/>
    <text x="150" y="428" text-anchor="middle" font-size="14" fill="#ffffff">Artık bir geliştiricisiniz!</text>
  </g>

  <path d="M705 340 h26 v-14 l24 24 l-24 24 v-14 h-26 z" fill="#2b6cb0"/>

  <!-- ===== 3. Geliştirici seçenekleri ===== -->
  <g transform="translate(750,70)">
    <text x="150" y="-30" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2933">3. USB hata ayıklama</text>
    <use xlink:href="#telefon"/>
    <text x="30" y="88" font-size="19" font-weight="bold" fill="#1f2933">Geliştirici seçenekleri</text>
    <g font-size="15" fill="#323f4b">
      <text x="30" y="140">Ekran açık kalsın</text>
      <rect x="226" y="126" width="40" height="20" rx="10" fill="#cbd2d9"/>
      <circle cx="237" cy="136" r="9" fill="#ffffff"/>
      <line x1="24" y1="164" x2="276" y2="164" stroke="#e4e7eb"/>
      <text x="30" y="192" fill="#7b8794" font-size="13">Hata ayıklama</text>
    </g>
    <rect x="18" y="206" width="264" height="62" rx="10" fill="#dbeafe" stroke="#2b6cb0" stroke-width="3"/>
    <text x="32" y="234" font-size="17" font-weight="bold" fill="#1e4e8c">USB hata ayıklama</text>
    <text x="32" y="254" font-size="12" fill="#3e4c59">USB bağlıyken hata ayıklama</text>
    <rect x="222" y="226" width="46" height="24" rx="12" fill="#2b6cb0"/>
    <circle cx="256" cy="238" r="10" fill="#ffffff"/>
    <text x="150" y="330" text-anchor="middle" font-size="14" fill="#616e7c">Bu anahtarı açın</text>
    <text x="150" y="350" text-anchor="middle" font-size="14" fill="#616e7c">(çıkan uyarıda "Tamam")</text>
  </g>

  <text x="540" y="630" text-anchor="middle" font-size="13" fill="#9aa5b1">Menü adları markaya göre biraz farklı olabilir. Ayrıntılar için aşağıdaki listeye bakın.</text>
</svg>
